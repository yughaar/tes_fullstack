<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleetify - Fleet Maintenance</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Login Section -->
    <div id="login-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow">
                        <div class="card-body p-4">
                            <div class="text-center mb-4">
                                <h2 class="fw-bold text-primary">
                                    <i class="bi bi-truck"></i> Fleetify
                                </h2>
                                <p class="text-muted">Fleet Maintenance System</p>
                            </div>
                            <div class="mb-3">
                                <label for="user-select" class="form-label">Pilih User</label>
                                <select id="user-select" class="form-select">
                                    <option value="">-- Pilih User --</option>
                                </select>
                            </div>
                            <button id="btn-login" class="btn btn-primary w-100" disabled>
                                <i class="bi bi-box-arrow-in-right"></i> Masuk
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App Section -->
    <div id="app-section" class="d-none">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="#">
                    <i class="bi bi-truck"></i> Fleetify
                </a>
                <div class="d-flex align-items-center">
                    <span id="user-info" class="text-white me-3"></span>
                    <button id="btn-logout" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </div>
            </div>
        </nav>

        <!-- Navigation Tabs -->
        <div class="container-fluid mt-3">
            <ul class="nav nav-tabs" id="main-tabs">
                <li class="nav-item">
                    <a class="nav-link active" href="#" data-tab="reports">
                        <i class="bi bi-list-task"></i> Riwayat Laporan
                    </a>
                </li>
                <li class="nav-item" id="tab-create-report">
                    <a class="nav-link" href="#" data-tab="create">
                        <i class="bi bi-plus-circle"></i> Buat Laporan
                    </a>
                </li>
            </ul>
        </div>

        <!-- Tab Content -->
        <div class="container-fluid mt-3 mb-5">
            <!-- Reports List Tab -->
            <div id="tab-content-reports" class="tab-pane-custom">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Riwayat Laporan Pemeliharaan</h4>
                    <button id="btn-export-csv" class="btn btn-success btn-sm">
                        <i class="bi bi-download"></i> Export CSV
                    </button>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>No</th>
                                <th>Nama SA</th>
                                <th>Nomor Polisi</th>
                                <th>Kendaraan</th>
                                <th>Keluhan</th>
                                <th>Status</th>
                                <th>Tanggal</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="reports-table-body">
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Create Report Tab -->
            <div id="tab-content-create" class="tab-pane-custom d-none">
                <h4 class="mb-3">Buat Laporan Pemeliharaan Baru</h4>
                <form id="form-create-report">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="vehicle-select" class="form-label">Kendaraan *</label>
                                <select id="vehicle-select" class="form-select" required>
                                    <option value="">-- Pilih Kendaraan --</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="odometer-input" class="form-label">Odometer (km) *</label>
                                <input type="number" id="odometer-input" class="form-control" min="1" required>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="complaint-input" class="form-label">Keluhan *</label>
                        <textarea id="complaint-input" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="initial-photo-input" class="form-label">Foto Awal Kendaraan</label>
                        <input type="file" id="initial-photo-input" class="form-control" accept="image/*">
                    </div>

                    <!-- Items Section -->
                    <div class="card mb-3">
                        <div class="card-header bg-secondary text-white">
                            <i class="bi bi-tools"></i> Estimasi Part/Jasa
                        </div>
                        <div class="card-body">
                            <div id="items-container"></div>
                            <button type="button" id="btn-add-item" class="btn btn-outline-primary btn-sm mt-2">
                                <i class="bi bi-plus"></i> Tambah Item
                            </button>
                        </div>
                        <div class="card-footer">
                            <strong>Total Estimasi: <span id="total-estimate">Rp 0</span></strong>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send"></i> Kirim Laporan
                    </button>
                </form>
            </div>

            <!-- Report Detail Modal -->
            <div class="modal fade" id="report-detail-modal" tabindex="-1">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Detail Laporan</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body" id="report-detail-body">
                        </div>
                        <div class="modal-footer" id="report-detail-footer">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
